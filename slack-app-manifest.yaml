display_information:
  name: Interview Triage
  description: Classifies forwarded email and posts the interview ones.
  background_color: "#2b2d42"
features:
  bot_user:
    display_name: Interview Triage
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - chat:write
      - files:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
